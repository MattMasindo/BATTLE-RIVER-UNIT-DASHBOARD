<style>
  body { font-family: 'Inter', sans-serif; background: #0F131B; }
  .font-display { font-family: 'Space Grotesk', sans-serif; }
  .font-mono { font-family: 'IBM Plex Mono', monospace; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .pop { animation: pop 0.4s ease; }

  /* ---- Rule 7: zero-blank-screen. Skeletons, spinners, progress bars. --- */
  @keyframes shimmer { 0% { background-position: -420px 0; } 100% { background-position: 420px 0; } }
  .skel {
    background: linear-gradient(90deg, #1B2231 0%, #263049 42%, #1B2231 84%);
    background-size: 420px 100%;
    animation: shimmer 1.25s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spin { animation: spin 0.7s linear infinite; }
  @keyframes indeterminate { 0% { left: -35%; width: 35%; } 60% { left: 100%; width: 35%; } 100% { left: 100%; width: 35%; } }
  .bar-indeterminate { position: absolute; top: 0; bottom: 0; border-radius: 999px; animation: indeterminate 1.15s ease-in-out infinite; }

  /* ---- Rule 14: bottom sheet ------------------------------------------- */
  @keyframes sheetIn { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .sheet-in { animation: sheetIn 0.24s cubic-bezier(0.32, 0.72, 0, 1); }
  .fade-in { animation: fadeIn 0.18s ease; }
  .sheet-grab { touch-action: none; }

  /* Bottom tab bar is fixed, so every scrollable page reserves room for it. */
  .has-bottom-nav { padding-bottom: calc(70px + env(safe-area-inset-bottom)); }

  @media (prefers-reduced-motion: reduce) {
    .skel, .spin, .bar-indeterminate, .sheet-in, .fade-in, .pop { animation: none !important; }
  }
</style>

<script>
(function () {
"use strict";
var h = React.createElement;
var useState = React.useState, useEffect = React.useEffect, useMemo = React.useMemo, useRef = React.useRef;
var sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
 
var COLORS = {
  ink: "#EDEFF5", inkLight: "#2DD4BF", parchment: "#0F131B", card: "#171D29",
  brass: "#F2B705", brassLight: "#F7CB55", slate: "#8891A6", rust: "#E24B4A",
  line: "#2A3244", good: "#2DD4BF", emphasis: "#FF6A3D"
};
 
// `auto: true` metrics are driven entirely by the Script Tool now (New
// Prospects from the Names List, Chat Script Usage from step advances) —
// AdvisorView renders these as read-only counts, no tap buttons. Appts,
// presented, and closed stay manually tappable here; Appointments Set also
// gets a +1 from the Script Tool when a conversation reaches a confirmed
// appointment, on top of whatever's tapped manually — the two add together.
// "Relationship Touches" is retired as its own tracked metric (folded into
// Chat Script Usage) — its historical column (`relationship`) is left
// untouched in the database, just no longer displayed or targeted here.
var METRICS = [
  { key: "prospecting", label: "New Prospects", short: "Prospecting", color: COLORS.slate, auto: true },
  { key: "approaching", label: "Chat Script Usage", short: "Script Usage", color: COLORS.brassLight, auto: true },
  { key: "appts", label: "Appointments Set", short: "Appointments", color: COLORS.brass },
  { key: "presented", label: "Clients Presented", short: "Presented", color: COLORS.ink },
  { key: "closed", label: "Clients Closed", short: "Closed", color: COLORS.rust }
];
 
function localDateStr(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth() + 1).padStart(2, "0");
  var day = String(d.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}
function todayStr(offset) {
  offset = offset || 0;
  var d = new Date();
  d.setDate(d.getDate() + offset);
  return localDateStr(d);
}
function startOfWeek(dateStr) {
  var d = new Date(dateStr + "T00:00:00");
  var day = d.getDay();
  d.setDate(d.getDate() + (day === 0 ? -6 : 1 - day));
  return localDateStr(d);
}
function prettyDate(dateStr) {
  return new Date(dateStr + "T00:00:00").toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric" });
}
function shortDate(dateStr) {
  return new Date(dateStr + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
// Seconds-granular "time since" for the auto-logged metrics sync label \u2014
// deliberately finer-grained than shortDate/fmtAgo-style helpers elsewhere,
// since the whole point is showing single-digit-second freshness against a
// 20s poll interval, not a coarse day-level relative time.
function fmtSyncAgo(ts) {
  if (!ts) return null;
  var secs = Math.max(0, Math.round((Date.now() - ts) / 1000));
  if (secs < 5) return "just now";
  if (secs < 60) return secs + "s ago";
  var mins = Math.floor(secs / 60);
  if (mins < 60) return mins + "m ago";
  var hrs = Math.floor(mins / 60);
  return hrs + "h ago";
}
function emptyEntry() {
  var row = { social: false, note: "", fyp: 0 };
  METRICS.forEach(function (m) { row[m.key] = 0; });
  return row;
}
function entryTotal(e) {
  if (!e) return 0;
  return METRICS.reduce(function (s, m) { return s + (e[m.key] || 0); }, 0);
}
function lget(key) { try { return JSON.parse(localStorage.getItem(key)); } catch (err) { return null; } }

    if (r.apps_3 && !r.coded_paid)           items.push({ kind: "confirmed", amount: 1000, label: "3 apps / coded",   detail: who });
    if (r.retained_90 && !r.retained_paid)   items.push({ kind: "confirmed", amount: 1500, label: "Retained 90 days", detail: who });

// ADVISOR PIN GATE — calls the SAME verify_advisor_pin() RPC the Script
// Tool already uses (security-definer, never returns the hash/plaintext).
// One PIN per advisor, shared across both apps, by design. The RPC itself
// decides "first time, set it" vs "compare it" — this client helper just
// turns its jsonb result into something the UI can read plainly. Nothing
// here modifies that RPC; it must already exist in this Supabase project
// for this to work (see PROJECT_TRACKER for the Script Tool's Patch 3
// migration that created it).
// ======================================================================

  try {
    var res = await sb.rpc("verify_advisor_pin", { p_advisor_id: advisorId, p_pin: pin });
    if (res.error) return { error: "Couldn't check that PIN \u2014 try again." };
    var d = res.data || {};
    if (d.error === "pin_too_short") return { error: "PIN must be at least 4 digits." };

// Copy-to-clipboard that always says what happened — a button that looks
// identical before and after a tap is indistinguishable from a broken one.

        navigator.clipboard.writeText(props.text || "").then(function () { done(true); }, function () { done(false); });
      } else { done(false); }
    } catch (e) { done(false); }
  };
  return h("div", { className: "mt-3" },
    h(BusyButton, {
      busy: state === "working", busyLabel: "Copying\u2026",
      label: state === "done" ? "\u2713 Copied" : state === "failed" ? "Couldn't copy \u2014 select the text above" : "Copy to clipboard",
      onClick: copy,

    })
  );
}

function ManagerAddSubmissionForm(props) {
  var roster = props.roster || [], onAdd = props.onAdd, onDone = props.onDone;

  var fd = form[0], patchForm = form[1], clearForm = form[2];

  function setNbAc(v) { patchForm({ nbAc: v }); }

    if (!serial.trim()) { setErr("Enter the APP serial number."); return; }

    var res = await onAdd(advisorCode, serial.trim(), clientName.trim() || null,
      amount, nbAc, submittedDate || null, settledDate || null);
